name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android-release:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Validate release configuration
        env:
          API_BASE_URL: ${{ vars.ANDROID_API_BASE_URL }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: test -n "$API_BASE_URL" && test -n "$DEBUG_KEYSTORE_BASE64"
      - name: Restore Android signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Test, lint, and build APK
        working-directory: android
        env:
          API_BASE_URL: ${{ vars.ANDROID_API_BASE_URL }}
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug -PAPI_BASE_URL="$API_BASE_URL"
      - name: Prepare release asset
        env:
          TAG: ${{ github.ref_name }}
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "my-kakeibo-${TAG}.apk"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: My 家計簿 ${{ github.ref_name }}
          generate_release_notes: true
          files: my-kakeibo-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
