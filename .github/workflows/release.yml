name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Validate release configuration
        env:
          API_BASE_URL: ${{ vars.ANDROID_API_BASE_URL }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: test -n "$API_BASE_URL" && test -n "$DEBUG_KEYSTORE_BASE64"
      - name: Restore Android signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          EXPECTED_CERT_SHA256: 704e9e40429d434b779f3c719bb13131c8a4ebf1616fbaa65de3391300358834
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          ACTUAL_CERT_SHA256=$(keytool -list -v -J-Duser.language=en -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
      - name: Test, lint, and build APK
        working-directory: android
        env:
          API_BASE_URL: ${{ vars.ANDROID_API_BASE_URL }}
          ANDROID_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/.android/debug.keystore
        run: |
          mkdir -p "${{ github.workspace }}/.android"
          cp "$HOME/.android/debug.keystore" "$ANDROID_DEBUG_KEYSTORE_PATH"
          ./gradlew testDebugUnitTest lintDebug assembleDebug -PAPI_BASE_URL="$API_BASE_URL"
      - name: Verify APK signing certificate
        env:
          EXPECTED_CERT_SHA256: 704e9e40429d434b779f3c719bb13131c8a4ebf1616fbaa65de3391300358834
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          ACTUAL_CERT_SHA256=$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | sed -n 's/.*certificate SHA-256 digest: //p')
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
      - name: Prepare release asset
        env:
          TAG: ${{ github.ref_name }}
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "my-kakeibo-${TAG}.apk"
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: My 家計簿 ${{ github.ref_name }}
          generate_release_notes: true
          files: my-kakeibo-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
      - name: Upload manually verified APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: android-release-verification
          path: my-kakeibo-${{ github.ref_name }}.apk
          if-no-files-found: error
